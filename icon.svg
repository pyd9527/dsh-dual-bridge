<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dual Bridge artwork. Same 36x36 canvas and inset rounded tile as the official
       plugin artwork, so the consumer's size attribute keeps authority over display
       size. Neutral gray tile (light-to-dark vertical gradient) with a white
       bidirectional arrow: two opposing horizontal arrows on a 18-unit centre line.
       Geometry only — no external references, fonts, or bitmaps. -->
  <rect x="4" y="4" width="28" height="28" rx="8" fill="url(#dual_bridge_neutral)" />
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 14h14" />
    <path d="M20 10l4 4-4 4" />
    <path d="M26 22H12" />
    <path d="M16 18l-4 4 4 4" />
  </g>
  <defs>
    <linearGradient id="dual_bridge_neutral" x1="18" y1="4" x2="18" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AA3AD" />
      <stop offset="1" stop-color="#4B5563" />
    </linearGradient>
  </defs>
</svg>
